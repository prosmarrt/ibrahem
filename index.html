<style>
:root{--bg:#eef2f5;--ink:#10222e;--mut:#5d7080;--pri:#0b5c7a;--pend:#d9480f;--done:#1b8a5a;--card:#fff;--line:#d5dee5}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
button,input,select,textarea{font:inherit}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;font-weight:800}
header small{opacity:.85;display:block;font-weight:400}
main{padding:12px;max-width:760px;margin:auto}
nav{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 2px;font-size:11px;color:var(--mut);font-weight:600}
nav button b{display:block;font-size:20px}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.card.done{border-inline-start:6px solid var(--done);background:#f4fbf7}
.card.pend{border-inline-start:6px solid var(--pend)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.t{font-weight:800;font-size:16px}
.m{color:var(--mut);font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#e3edf3;color:var(--pri);font-weight:600}
.btn{border:1px solid var(--pri);background:#fff;color:var(--pri);padding:8px 12px;border-radius:8px;font-weight:600;cursor:pointer}
.btn.p{background:var(--pri);color:#fff}.btn.g{background:var(--done);border-color:var(--done);color:#fff}.btn.r{border-color:#b42318;color:#b42318}
.btn.big{width:100%;padding:14px;font-size:17px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:4px 0 8px}
label{font-size:13px;color:var(--mut);font-weight:600}
h2{font-size:15px;margin:16px 0 8px;color:var(--pri)}
.note{background:#fff8e1;border-radius:6px;padding:6px 8px;font-size:13px;margin-top:6px}
.bar{height:8px;background:#dbe5eb;border-radius:9px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:var(--done)}
.login{max-width:340px;margin:12vh auto;padding:0 16px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.toast{position:fixed;top:70px;inset-inline:16px;background:#10222e;color:#fff;padding:10px 14px;border-radius:8px;z-index:9;text-align:center}
:focus-visible{outline:3px solid #f59f00;outline-offset:2px}
</style>
</head>

<div id="app"><p style="text-align:center;margin-top:30vh;color:#5d7080">جاري التحميل...</p></div>

<script type="module">

import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, getDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const cfg = {
  apiKey: "AIzaSyBPx9qM2pPfVYk-Ie-zabVDS1OsQ1sO5OE",
  authDomain: "ibrahem-hassn.firebaseapp.com",
  projectId: "ibrahem-hassn",

const fb = initializeApp(cfg), auth = getAuth(fb), db = getFirestore(fb);
setPersistence(auth, browserLocalPersistence).catch(() => {});
const AREAS = ["التجمع الخامس", "بدر", "العاصمة الإدارية"];
const DOMAIN = "@ibrahem.app";
const SEED = [["HSBC","ملحق ووتر واي (نُقل من أكاديمية الشروق)","التجمع الخامس",30.042315,31.475399,"77166","لوكيشن تقريبي - حدّثه من زر 📍 وانت قدام الفرع"],["بنك القاهرة","مول مون فالي","التجمع الخامس",30.024954,31.488461,"79970",""],["بنك القاهرة","ميد تاون","التجمع الخامس",30.013829,31.501073,"811008",""],["بنك الإسكندرية","305 التسعين الجنوبي - القطاع الثاني","التجمع الخامس",30.025963,31.467129,"79933",""],["CIB","44 منطقة المستثمرين الجنوبية","التجمع الخامس",null,null,"78025",""],["CIB","كونكورد بلازا مول","التجمع الخامس",30.025046,31.483895,"78273",""],["CIB","ميفيدا (16 قطاع شرق)","التجمع الخامس",30.007604,31.530427,"810329",""],["CIB","ستريب مول التجمع (نُقل من الزمالك)","التجمع الخامس",null,null,"810455",""],["CIB","الخزنة المركزية - 39 المستثمرين الجنوبية","التجمع الخامس",null,null,"811103",""],["CIB","وزارة الخارجية","العاصمة الإدارية",30.015349,31.750954,"966074",""],["CIB","الكيان العسكري","العاصمة الإدارية",null,null,"966081",""],["CIB","مدينتي - ذا ستريب","التجمع الخامس",30.072442,31.647885,"965995",""],["CIB","مدينة بدر","بدر",null,null,"",""],["بنك البركة","سبلاندا 310 - سوديك","التجمع الخامس",null,null,"812517",""],["بنك البركة","القطاع الثاني - مركز المدينة (التسعين الشمالي)","التجمع الخامس",30.029631,31.463712,"966041","لوكيشن تقريبي - حدّثه من زر 📍 وانت قدام الفرع"],["البنك الزراعي المصري","مجمع البنوك","العاصمة الإدارية",null,null,"812511",""],["التعمير والإسكان","المجاورة الرابعة - بدر","بدر",30.137712,31.725992,"810385",""],["التعمير والإسكان","بيرل دي روا","التجمع الخامس",null,null,"811147",""],["فيصل الإسلامي","زيزينيا","التجمع الخامس",30.009784,31.494275,"78253",""],["فيصل الإسلامي","حي المال والأعمال (1A2)","العاصمة الإدارية",null,null,"812515",""],["EGBANK","فرع 217 - بجوار شركة الغاز","التجمع الخامس",30.03008,31.454737,"810372",""],["EGBANK","ميتينج بوينت مول","التجمع الخامس",30.025947,31.489644,"810373",""],["المصري لتنمية الصادرات","الحي المالي A2/11","العاصمة الإدارية",null,null,"811204",""],["الاستثمار العربي NXT","كونكورد بلازا","التجمع الخامس",30.025046,31.483895,"79865","لوكيشن تقريبي - حدّثه من زر 📍 وانت قدام الفرع"],["التنمية الصناعية والعمال","التسعين الشمالي قطعة 255-257","التجمع الخامس",null,null,"811166",""],["التنمية الصناعية والعمال","ذا أرينا مول - مركز المدينة","التجمع الخامس",30.0184,31.425275,"966663",""],["SAIB","جنوب الأكاديمية - المعهد الكندي CIC","التجمع الخامس",null,null,"69193",""],["SAIB","أجورا مول","التجمع الخامس",30.020695,31.528625,"966029",""],["الإمارات دبي الوطني","بوينت 90 (نُقل من المنيل)","التجمع الخامس",30.020195,31.494646,"78029",""],["المصرف العربي الدولي","العاصمة الإدارية","العاصمة الإدارية",null,null,"",""],["كريدي أجريكول","ميفيدا - مبنى 6","التجمع الخامس",30.007604,31.530427,"964544","لوكيشن تقريبي - حدّثه من زر 📍 وانت قدام الفرع"],["الأهلي الكويتي","أجورا مول","التجمع الخامس",30.020695,31.528625,"964550","لوكيشن تقريبي - حدّثه من زر 📍 وانت قدام الفرع"],["بنك مصر","الملاهي - طريق العين السخنة (أمام ديستركت مول)","التجمع الخامس",null,null,"964595",""],["البنك الأهلي المصري","القطامية - طريق العين السخنة","التجمع الخامس",null,null,"964608",""],["بنك مصر","نادي بنك مصر - شارع التسعين","التجمع الخامس",null,null,"966010",""],["بنك مصر","سوديك - التسعين الجنوبي","التجمع الخامس",null,null,"966049",""],["بنك مصر","مول الكيان العسكري","العاصمة الإدارية",null,null,"966089",""]];


const S = { user: null, admin: false, tab: "left", banks: [], visits: [], plan: [], area: "", month: mk(new Date()), loaded: 0, ordered: null, works: [], formBank: "", draft: { floors: [] } };
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => new Date().toISOString().slice(0, 10);
function mk(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function toast(m) { const e = document.createElement("div"); e.className = "toast"; e.textContent = m; document.body.append(e); setTimeout(() => e.remove(), 2600); }
const bank = id => S.banks.find(b => b.id === id);
const title = b => b ? `${b.bank} - ${b.branch}` : "(بنك محذوف)";

/* ---------- login ---------- */
function loginView(err = "") {
  $("#app").innerHTML = `<div class="login"><h1 style="text-align:center">زيارات الإنذار المرئي</h1>
  <div class="card"><label>اسم المستخدم</label><input id="u" autocomplete="username" autocapitalize="none">
  <label>كلمة السر</label><input id="p" type="password" autocomplete="current-password">
  <button class="btn p big" id="go">دخول</button>${err ? `<p style="color:#b42318">${esc(err)}</p>` : ""}</div></div>`;
  const go = async () => {
    try { await signInWithEmailAndPassword(auth, $("#u").value.trim().toLowerCase() + DOMAIN, $("#p").value); }
    catch (e) { loginView("اليوزر أو الباسورد غلط"); }
  };
  $("#go").onclick = go; $("#p").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

onAuthStateChanged(auth, async u => {
  if (!u) { S.user = null; return loginView(); }
  S.user = u;
  const r = await getDoc(doc(db, "users", u.uid));
  S.admin = r.exists() && r.data().role === "admin";
  start();
});

/* ---------- data ---------- */
let unsub = [];
function start() {
  unsub.forEach(f => f()); unsub = []; S.loaded = 0;
  unsub.push(onSnapshot(collection(db, "banks"), s => { S.banks = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.bank + a.branch).localeCompare(b.bank + b.branch, "ar")); S.loaded |= 1; ensureMonth(); render(); }));
  unsub.push(onSnapshot(query(collection(db, "visits"), where("month", "==", mk(new Date()))), s => { S.visits = s.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded |= 2; ensureMonth(); render(); }));
  unsub.push(onSnapshot(doc(db, "plans", today()), s => { S.plan = s.exists() ? s.data().ids || [] : []; render(); }));
  unsub.push(onSnapshot(collection(db, "works"), s => { S.works = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }));
  render();
}
/* أول كل شهر: كل بنك ياخد زيارة جديدة تلقائي (id ثابت علشان ما تتكررش) */
function ensureMonth() {
  if (S.loaded !== 3) return;
  const m = mk(new Date());
  S.banks.forEach(b => { if (!S.visits.some(v => v.bankId === b.id)) setDoc(doc(db, "visits", `${b.id}_${m}_1`), { bankId: b.id, month: m, n: 1, done: false, note: "" }); });
}

/* ---------- geo ---------- */
function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error("المتصفح مش بيدعم اللوكيشن"));
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      () => rej(new Error("شغّل الـ GPS واسمح للصفحة بالوصول للموقع وجرب تاني")), { enableHighAccuracy: true, timeout: 15000 });
  });
}
function dist(a, b) { const R = 6371, r = x => x * Math.PI / 180, dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng); const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
const hasLoc = b => b && isFinite(b.lat) && isFinite(b.lng) && b.lat !== null;
const mapsTo = b => `https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}&travelmode=two-wheeler`;

/* أقرب بنك فأقرب بنك، بادئ من مكانه الحالي */
async function buildRoute() {
  const items = S.plan.map(id => S.visits.find(v => v.id === id)).filter(v => v && !v.done && hasLoc(bank(v.bankId)));
  if (!items.length) return toast("اختار بنوك ليها لوكيشن في خطة النهارده");
  let cur;
  try { cur = await getPos(); } catch (e) { return toast(e.message); }
  const left = [...items], out = []; let p = cur;
  while (left.length) { let bi = 0, bd = 1e9; left.forEach((v, i) => { const d = dist(p, bank(v.bankId)); if (d < bd) { bd = d; bi = i; } }); const v = left.splice(bi, 1)[0]; out.push(v); p = bank(v.bankId); }
  S.ordered = out.map(v => v.id); render();
  const pts = out.map(v => bank(v.bankId)); const dest = pts[pts.length - 1], way = pts.slice(0, -1).slice(0, 9);
  window.open(`https://www.google.com/maps/dir/?api=1&origin=${cur.lat},${cur.lng}&destination=${dest.lat},${dest.lng}${way.length ? "&waypoints=" + way.map(b => b.lat + "," + b.lng).join("|") : ""}&travelmode=two-wheeler`, "_blank");
  if (pts.length > 10) toast("جوجل ماب بياخد 10 نقط بس، افتح الباقي بالترتيب من الأزرار");
}

/* ---------- views ---------- */
function visitCard(v, opt = {}) {
  const b = bank(v.bankId); if (!b) return "";
  const inPlan = S.plan.includes(v.id);
  const idx = S.ordered ? S.ordered.indexOf(v.id) : -1;
  return `<div class="card ${v.done ? "done" : "pend"}" data-v="${v.id}">
  <div class="row sp"><div class="t">${idx >= 0 ? `<span class="tag" style="background:var(--pri);color:#fff">${idx + 1}</span> ` : ""}${esc(title(b))}</div><span class="tag">${esc(b.area)}</span></div>
  <div class="m">محطة ${esc(b.station || "-")}${v.n > 1 ? " · زيارة رقم " + v.n : ""}${v.done ? " · اتعملت " + new Date(v.doneAt).toLocaleDateString("ar-EG") : ""}</div>
  ${b.notes ? `<div class="note">📝 ${esc(b.notes)}</div>` : ""}${v.note ? `<div class="note">🔧 ${esc(v.note)}</div>` : ""}
  <div class="row" style="margin-top:8px">
  ${v.done ? `<button class="btn" data-a="undo">رجوع</button>` : `<button class="btn g" data-a="done">✔ تم</button>`}
  ${hasLoc(b) ? `<a class="btn" href="${mapsTo(b)}" target="_blank" style="text-decoration:none">📍 اتجاهات</a>` : `<span class="m">مفيش لوكيشن</span>`}
  ${!v.done ? `<button class="btn ${inPlan ? "r" : ""}" data-a="plan">${inPlan ? "شيل من الخطة" : "➕ خطة النهارده"}</button>` : ""}
  <button class="btn" data-a="bnote">📝 ملاحظة البنك</button><button class="btn" data-a="again">زيارة تانية</button>
  </div></div>`;
}

function leftView() {
  const list = S.visits.filter(v => bank(v.bankId) && (!S.area || bank(v.bankId).area === S.area));
  const done = list.filter(v => v.done).length, pct = list.length ? Math.round(done / list.length * 100) : 0;
  let h = `<select id="af"><option value="">كل المناطق</option>${AREAS.map(a => `<option ${S.area === a ? "selected" : ""}>${a}</option>`).join("")}</select>
  <div class="m">الشهر ده: اتعمل ${done} من ${list.length}</div><div class="bar"><i style="width:${pct}%"></i></div>`;
  if (!list.length) return h + `<div class="empty">مفيش بنوك لسه. افتح تبويب "البنوك" وضيف أول بنك.</div>`;
  const areas = S.area ? [S.area] : [...new Set(list.map(v => bank(v.bankId).area))];
  areas.forEach(a => {
    const al = list.filter(v => bank(v.bankId).area === a).sort((x, y) => x.done - y.done);
    h += `<h2>${esc(a)} · باقي ${al.filter(v => !v.done).length} من ${al.length}</h2>` + al.map(v => visitCard(v)).join("");
  });
  return h;
}

function planView() {
  const items = S.plan.map(id => S.visits.find(v => v.id === id)).filter(Boolean);
  const sorted = S.ordered ? [...items].sort((a, b) => S.ordered.indexOf(a.id) - S.ordered.indexOf(b.id)) : items;
  return `<div class="card"><div class="t">خطة النهارده (${items.length})</div><div class="m">ضيف البنوك من تبويب "الباقي"، وبعدين دوس ابدأ الطريق وهيرتبهم من أقرب واحد لمكانك.</div></div>
  ${items.length ? `<button class="btn p big" id="route" style="margin-bottom:12px">🏍️ ابدأ الطريق</button>` : ""}
  ${sorted.map(v => visitCard(v)).join("") || `<div class="empty">الخطة فاضية.</div>`}`;
}

function banksView() {
  return `<div class="card"><div class="t">إضافة بنك / فرع</div>
  <label>اسم البنك</label><input id="nb"><label>اسم الفرع</label><input id="nr">
  <label>رقم المحطة</label><input id="ns" inputmode="numeric"><label>المنطقة</label><select id="na">${AREAS.map(a => `<option>${a}</option>`).join("")}</select>
  <label>اللوكيشن</label><input id="nl" placeholder="خط العرض,خط الطول" dir="ltr">
  <button class="btn" id="gps">📍 هات موقعي الحالي</button>
  <label style="display:block;margin-top:8px">ملاحظات</label><textarea id="nn" rows="2"></textarea>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="nnw" style="width:auto;margin:0"> بنك جديد محتاج تركيب</label>
  <button class="btn p big" id="addb">حفظ البنك</button></div>
  <button class="btn big" id="seed" style="margin-bottom:12px">⬇️ استيراد قايمة الحماية المدنية (${SEED.length} فرع بأكواد المحطات)</button>
  <h2>كل البنوك (${S.banks.length})</h2>
  ${S.banks.map(b => `<div class="card" data-b="${b.id}"><div class="row sp"><div class="t">${esc(title(b))}</div><span class="tag">${esc(b.area)}</span></div>
  <div class="m">محطة ${esc(b.station || "-")} · ${hasLoc(b) ? "اللوكيشن متسجل ✅" : "من غير لوكيشن ❌"}</div>
  <div class="row" style="margin-top:8px"><button class="btn" data-a="stn">🔢 رقم المحطة</button><button class="btn" data-a="loc">📍 حدّث اللوكيشن</button><button class="btn" data-a="bnote2">📝 ملاحظة</button>${S.admin ? `<button class="btn r" data-a="delb">حذف</button>` : ""}</div></div>`).join("")}`;
}

function reportView() {
  return `<div class="card"><div class="t">تقرير الزيارات</div><label>الشهر</label><input type="month" id="rm" value="${S.month}">
  <div class="row"><button class="btn p" id="xl">📊 Excel</button><button class="btn p" id="pdf">📄 PDF</button></div></div>
  ${S.admin ? `<div class="card"><div class="t">إضافة مستخدم</div><label>اسم المستخدم (إنجليزي)</label><input id="cu" dir="ltr"><label>كلمة السر (6 حروف على الأقل)</label><input id="cp" dir="ltr">
  <button class="btn" id="addu">إنشاء حساب</button></div>` : ""}
  <button class="btn r big" id="out">تسجيل خروج</button>`;
}

const FF = [["name","اسم المنشأة"],["address","العنوان"],["activity","طبيعة النشاط"],["floorsCount","عدد الطوابق"],["phone","رقم تليفون المنشأة"],["safety","اسم مسؤول السلامة"],["workStart","بداية توقيت العمل"],["workEnd","نهاية توقيت العمل"],["holidays","أيام الأجازات"],["panel","مكان لوحة الكهرباء"],["gas","مكان محبس الغاز"],["water","أقرب مصادر مياه للمنشأة"],["hydrant","أقرب حنفيات إطفاء للمنشأة"],["district","الحي"],["fs1","أقرب نقطة إطفاء (1)"],["fs2","أقرب نقطة إطفاء (2)"],["fs3","أقرب نقطة إطفاء (3)"],["police","قسم الشرطة التابع له المنشأة"],["hazards","مصادر الخطورة بالمنشأة"],["medium","الوسيط الإطفائي"],["since","تاريخ الدخول في الخدمة"],["nr","المنشأة المجاورة - يمين"],["nrA","نشاطها"],["nl","المنشأة المجاورة - يسار"],["nlA","نشاطها"],["nf","المنشأة المجاورة - أمامي"],["nfA","نشاطها"],["nb","المنشأة المجاورة - خلفي"],["nbA","نشاطها"]];
const FL = [["activity","نشاط الطابق"],["foam","طفايات فوم (عدد)"],["powder","طفايات بودرة (عدد)"],["co2","طفايات CO₂ (عدد)"],["otherType","أنواع أخرى (النوع)"],["otherCount","أنواع أخرى (العدد)"]];
const NUM = ["foam", "powder", "co2", "otherCount"];
const shrink = f => new Promise(r => { const im = new Image(); im.onload = () => { const k = Math.min(1, 700 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = im.width * k; c.height = im.height * k; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); r(c.toDataURL("image/jpeg", .6)); }; im.src = URL.createObjectURL(f); });

function workView() {
  const nw = S.banks.filter(b => b.isNew), list = [...S.works].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return `<div class="card"><div class="t">تسجيل تركيب / تغيير قطعة</div>
  <label>البنك</label><select id="wb">${S.banks.map(b => `<option value="${b.id}">${esc(title(b))}</option>`).join("")}</select>
  <label>النوع</label><select id="wt"><option>تركيب جديد</option><option>تغيير قطعة</option></select>
  <label>القطعة</label><input id="wp" placeholder="مثلاً: سارينة / فلاشر / لوحة تحكم">
  <label>العدد</label><input id="wq" type="number" value="1"><label>التاريخ</label><input id="wd" type="date" value="${today()}">
  <label>ملاحظات</label><textarea id="wn" rows="2"></textarea><button class="btn p big" id="addw">حفظ</button></div>
  ${nw.length ? `<h2>بنوك جديدة لسه متركبش فيها (${nw.length})</h2>` + nw.map(b => `<div class="card pend"><div class="t">${esc(title(b))}</div><div class="m">${esc(b.area)}</div></div>`).join("") : ""}
  <h2>السجل (${list.length})</h2>${list.map(w => `<div class="card"><div class="row sp"><div class="t">${esc(title(bank(w.bankId)))}</div><span class="tag">${esc(w.type)}</span></div><div class="m">${esc(w.part)} × ${esc(w.qty)} · ${esc(w.date)}</div>${w.notes ? `<div class="note">${esc(w.notes)}</div>` : ""}${S.admin ? `<button class="btn r" data-a="delw" data-w="${w.id}" style="margin-top:6px">حذف</button>` : ""}</div>`).join("") || `<div class="empty">مفيش سجل لسه.</div>`}`;
}

function formView() {
  const d = S.draft, b = bank(S.formBank);
  let h = `<div class="card"><label>اختار البنك</label><select id="fb"><option value="">—</option>${S.banks.map(x => `<option value="${x.id}" ${x.id === S.formBank ? "selected" : ""}>${esc(title(x))}</option>`).join("")}</select></div>`;
  if (!b) return h + `<div class="empty">اختار بنك علشان تملا استمارته.</div>`;
  return h + `<div class="card"><div class="t">بيانات المنشأة</div>${FF.map(([k, l]) => `<label>${l}</label><input data-f="${k}" value="${esc(d[k])}">`).join("")}
  <div class="m">الإحداثيات: ${hasLoc(b) ? b.lat.toFixed(6) + " , " + b.lng.toFixed(6) : "مفيش لوكيشن"}</div>
  <label>صورة خارجية للمنشأة</label><input type="file" accept="image/*" data-img="photo">${d.photo ? `<img src="${d.photo}" style="max-width:100%;border-radius:8px">` : ""}</div>
  <h2>الطوابق وطفايات الحريق</h2>
  ${(d.floors || []).map((f, i) => `<div class="card"><div class="row sp"><div class="t">الطابق ${i + 1}</div><button class="btn r" data-a="delf" data-i="${i}">حذف</button></div>${FL.map(([k, l]) => `<label>${l}</label><input data-fl="${i}.${k}" value="${esc(f[k])}" ${NUM.includes(k) ? 'type="number" inputmode="numeric"' : ""}>`).join("")}
  <label>رسم كروكي للدور (صورة)</label><input type="file" accept="image/*" data-img="${i}">${f.sketch ? `<img src="${f.sketch}" style="max-width:100%">` : ""}</div>`).join("")}
  <button class="btn big" data-a="addf" style="margin-bottom:8px">➕ إضافة طابق</button>
  <button class="btn p big" id="savef">💾 حفظ</button><button class="btn big" id="pdff" style="margin-top:8px">📄 تصدير PDF</button>`;
}

function formPDF(b, d) {
  const f = d.floors || [], w = window.open("", "_blank");
  w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>${esc(title(b))}</title><style>body{font-family:Cairo,Arial;padding:18px;font-size:13px}h2{border-bottom:2px solid #0b5c7a;color:#0b5c7a}table{border-collapse:collapse;width:100%;margin:6px 0}td,th{border:1px solid #888;padding:5px;vertical-align:top}th{background:#e3edf3}.k th{width:35%;text-align:right}.fl{margin:0 0 12px;page-break-inside:avoid}img{max-width:100%;max-height:260px}</style></head><body><h2>استمارة بيانات منشأة - ${esc(title(b))}</h2><table class="k">${FF.map(([k, l]) => `<tr><th>${l}</th><td>${esc(d[k])}</td></tr>`).join("")}<tr><th>الإحداثيات (خط العرض , خط الطول)</th><td>${hasLoc(b) ? b.lat + " , " + b.lng : ""}</td></tr></table>${d.photo ? `<p><img src="${d.photo}"></p>` : ""}
  <h2 style="page-break-before:always">طفايات الحريق لكل طابق</h2>${f.map((x, i) => `<div class="fl"><b>الطابق ${i + 1}: ${esc(x.activity)}</b><table><tr><th>فوم</th><th>بودرة</th><th>CO₂</th><th>${esc(x.otherType || "نوع آخر")}</th></tr><tr><td>${esc(x.foam)}</td><td>${esc(x.powder)}</td><td>${esc(x.co2)}</td><td>${esc(x.otherCount)}</td></tr></table>${x.sketch ? `<img src="${x.sketch}">` : ""}</div>`).join("") || "<p>لا توجد طوابق.</p>"}</body></html>`);
  w.document.close(); setTimeout(() => w.print(), 600);
}

async function workRows(m) {
  const s = await getDocs(query(collection(db, "works"), where("date", ">=", m + "-01"), where("date", "<=", m + "-31")));
  return s.docs.map(d => d.data()).map(w => { const b = bank(w.bankId); return { "التاريخ": w.date, "المنطقة": b?.area || "", "البنك": b?.bank || "", "الفرع": b?.branch || "", "النوع": w.type, "القطعة": w.part, "العدد": w.qty, "ملاحظات": w.notes || "" }; }).sort((a, b) => a["التاريخ"].localeCompare(b["التاريخ"]));
}

function render() {
  if (!S.user) return;
  const ae = document.activeElement;
  if (["banks", "work", "form"].includes(S.tab) && ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
  const tabs = [["left", "📋", "الباقي"], ["plan", "🏍️", "النهارده"], ["banks", "🏦", "البنوك"], ["work", "🔧", "تركيب"], ["form", "📝", "استمارات"], ["rep", "📊", "تقارير"]];
  const scroll = scrollY;
  $("#app").innerHTML = `<header><h1>زيارات الإنذار المرئي<small>${new Date().toLocaleDateString("ar-EG", { month: "long", year: "numeric" })}</small></h1></header>
  <main>${{ left: leftView, plan: planView, banks: banksView, work: workView, form: formView, rep: reportView }[S.tab]()}</main>
  <nav>${tabs.map(t => `<button class="${S.tab === t[0] ? "on" : ""}" data-t="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join("")}</nav>`;
  scrollTo(0, scroll);
}

/* ---------- reports ---------- */
async function monthRows(m) {
  const s = await getDocs(query(collection(db, "visits"), where("month", "==", m)));
  const bs = {}; S.banks.forEach(b => bs[b.id] = b);
  return s.docs.map(d => d.data()).filter(v => bs[v.bankId]).map(v => { const b = bs[v.bankId]; return { "المنطقة": b.area, "البنك": b.bank, "الفرع": b.branch, "المحطة": b.station || "", "رقم الزيارة": v.n || 1, "الحالة": v.done ? "تمت" : "لم تتم", "تاريخ الزيارة": v.done && v.doneAt ? new Date(v.doneAt).toLocaleDateString("ar-EG") : "", "ملاحظات": [b.notes, v.note].filter(Boolean).join(" | ") }; })
    .sort((a, b) => a["المنطقة"].localeCompare(b["المنطقة"], "ar") || (a["الحالة"] === "لم تتم" ? -1 : 1));
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-t]"); if (t) { S.tab = t.dataset.t; return render(); }
  const el = e.target.closest("[data-a],#seed,#route,#addw,#savef,#pdff,#gps,#addb,#xl,#pdf,#addu,#out"); if (!el) return;
  const vc = e.target.closest("[data-v]"), v = vc && S.visits.find(x => x.id === vc.dataset.v), bc = e.target.closest("[data-b]");
  const a = el.dataset.a, id = el.id;
  try {
    if (a === "done") { const note = prompt("ملاحظة عن الزيارة (اختياري):", v.note || ""); if (note === null) return; await updateDoc(doc(db, "visits", v.id), { done: true, doneAt: Date.now(), note }); toast("اتسجلت ✔"); }
    else if (a === "undo") await updateDoc(doc(db, "visits", v.id), { done: false, doneAt: null });
    else if (a === "plan") { const ids = S.plan.includes(v.id) ? S.plan.filter(x => x !== v.id) : [...S.plan, v.id]; S.ordered = null; await setDoc(doc(db, "plans", today()), { ids }); }
    else if (a === "bnote") { const b = bank(v.bankId), n = prompt("ملاحظات على " + title(b), b.notes || ""); if (n !== null) await updateDoc(doc(db, "banks", b.id), { notes: n }); }
    else if (a === "bnote2") { const b = bank(bc.dataset.b), n = prompt("ملاحظات على " + title(b), b.notes || ""); if (n !== null) await updateDoc(doc(db, "banks", b.id), { notes: n }); }
    else if (a === "again") { const n = S.visits.filter(x => x.bankId === v.bankId).length + 1; await setDoc(doc(db, "visits", `${v.bankId}_${S.visits[0].month}_${n}`), { bankId: v.bankId, month: v.month, n, done: false, note: "" }); toast("اتضافت زيارة جديدة"); }
    else if (a === "stn") { const b = bank(bc.dataset.b), n = prompt("رقم المحطة - " + title(b), b.station || ""); if (n !== null) await updateDoc(doc(db, "banks", b.id), { station: n.trim() }); }
    else if (id === "seed") {
      if (!confirm("هتتحدّث القايمة بقايمة الحماية المدنية (" + SEED.length + " فرع) وهتتمسح بنوك الاستيراد القديمة. كمّل؟")) return;
      for (const o of S.banks) if (o.id.startsWith("seed")) await deleteDoc(doc(db, "banks", o.id));
      for (let i = 0; i < SEED.length; i++) {
        const [bk, br, ar, la, lo, st, nt] = SEED[i], id2 = "st" + (st || "x" + String(i).padStart(2, "0")), old = S.banks.find(x => x.id === id2), d = { bank: bk, branch: br, station: st, area: ar };
        if (la != null && !(old && hasLoc(old))) { d.lat = la; d.lng = lo; }
        if (!old) { d.notes = nt; d.createdAt = serverTimestamp(); }
        await setDoc(doc(db, "banks", id2), d, { merge: true });
      }
      toast("اتحدّثت القايمة ✔");
    }
    else if (a === "loc") { const p = await getPos(); await updateDoc(doc(db, "banks", bc.dataset.b), { lat: p.lat, lng: p.lng }); toast("اتحدّث اللوكيشن"); }
    else if (a === "delb") { if (confirm("تحذف البنك ده؟")) await deleteDoc(doc(db, "banks", bc.dataset.b)); }
    else if (id === "route") buildRoute();
    else if (id === "gps") { const p = await getPos(); $("#nl").value = p.lat.toFixed(6) + "," + p.lng.toFixed(6); }
    else if (id === "addb") {
      const nm = $("#nb").value.trim(), br = $("#nr").value.trim(); if (!nm || !br) return toast("اكتب اسم البنك والفرع");
      const d = { bank: nm, branch: br, station: $("#ns").value.trim(), area: $("#na").value, notes: $("#nn").value.trim(), isNew: $("#nnw").checked, lat: null, lng: null, createdAt: serverTimestamp() };
      const ll = $("#nl").value.split(",").map(Number); if (ll.length === 2 && ll.every(isFinite)) { d.lat = ll[0]; d.lng = ll[1]; }
      await addDoc(collection(db, "banks"), d); toast("اتضاف البنك"); S.tab = "banks"; render();
    }
    else if (a === "addf") { (S.draft.floors = S.draft.floors || []).push({}); render(); }
    else if (a === "delf") { S.draft.floors.splice(+el.dataset.i, 1); render(); }
    else if (a === "delw") { if (confirm("تحذف السجل ده؟")) await deleteDoc(doc(db, "works", el.dataset.w)); }
    else if (id === "addw") {
      const b = $("#wb").value, p = $("#wp").value.trim(); if (!b || !p) return toast("اختار البنك واكتب القطعة"); const t = $("#wt").value;
      await addDoc(collection(db, "works"), { bankId: b, type: t, part: p, qty: +$("#wq").value || 1, date: $("#wd").value || today(), notes: $("#wn").value.trim(), createdAt: serverTimestamp() });
      if (t === "تركيب جديد") await updateDoc(doc(db, "banks", b), { isNew: false }); toast("اتسجل ✔");
    }
    else if (id === "savef") { await setDoc(doc(db, "surveys", S.formBank), { ...S.draft, updatedAt: Date.now() }); toast("اتحفظت الاستمارة ✔"); }
    else if (id === "pdff") formPDF(bank(S.formBank), S.draft);
    else if (id === "xl" || id === "pdf") {
      const m = $("#rm").value, rows = await monthRows(m), ws = await workRows(m);
      if (!rows.length && !ws.length) return toast("مفيش بيانات للشهر ده");
      if (id === "xl") { const wb = XLSX.utils.book_new(); if (rows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "زيارات"); if (ws.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ws), "تركيب وتغيير"); wb.Workbook = { Views: [{ RTL: true }] }; XLSX.writeFile(wb, `تقرير-${m}.xlsx`); }
      else {
        const tb = r => { if (!r.length) return ""; const k = Object.keys(r[0]); return `<table><tr>${k.map(x => `<th>${x}</th>`).join("")}</tr>${r.map(o => `<tr>${k.map(x => `<td>${esc(o[x])}</td>`).join("")}</tr>`).join("")}</table>`; };
        const w = window.open("", "_blank");
        w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>تقرير ${m}</title><style>body{font-family:Cairo,Arial;padding:16px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border:1px solid #888;padding:5px}th{background:#e3edf3}</style></head><body><h2>تقرير الزيارات - ${m}</h2>${tb(rows)}${ws.length ? "<h2>تركيب وتغيير</h2>" + tb(ws) : ""}</body></html>`);
        w.document.close(); setTimeout(() => w.print(), 500);
      }
    }
    else if (id === "addu") {
      const u = $("#cu").value.trim().toLowerCase(), p = $("#cp").value; if (!u || p.length < 6) return toast("اليوزر والباسورد (6+) مطلوبين");
      const sec = initializeApp(cfg, "sec" + Date.now()), r = await createUserWithEmailAndPassword(getAuth(sec), u + DOMAIN, p);
      await setDoc(doc(db, "users", r.user.uid), { username: u, role: "user" }); await signOut(getAuth(sec)); toast("اتعمل الحساب");
    }
    else if (id === "out") signOut(auth);
  } catch (err) { toast(err.message || "حصل خطأ"); }
});
document.addEventListener("input", e => { const t = e.target; if (t.dataset.f) S.draft[t.dataset.f] = t.value; else if (t.dataset.fl) { const [i, k] = t.dataset.fl.split("."); S.draft.floors[+i][k] = t.value; } });
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "fb") {
    S.formBank = t.value; t.blur(); const b = bank(S.formBank);
    if (b) { const r = await getDoc(doc(db, "surveys", b.id)); S.draft = r.exists() ? r.data() : { name: title(b), address: b.area, floors: [] }; if (!S.draft.floors) S.draft.floors = []; }
    render();
  }
  if (t.dataset.img !== undefined && t.files[0]) { const u = await shrink(t.files[0]); if (t.dataset.img === "photo") S.draft.photo = u; else S.draft.floors[+t.dataset.img].sketch = u; t.blur(); render(); }
  if (e.target.id === "af") { S.area = e.target.value; render(); }
  if (e.target.id === "rm") S.month = e.target.value;
});
</script>
</body>
</html>
